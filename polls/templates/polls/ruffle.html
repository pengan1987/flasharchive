<html>

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <title>Flash Archive - Player</title>
    <link rel="stylesheet" href="https://www.compumuseum.com/base.css" />
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/meyer-reset/2.0/reset.min.css">
    <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/4.1.1/css/bootstrap.min.css" rel="stylesheet">

    <style>
        #player_container {
            margin-top: 20px;
            margin-left: auto;
            margin-right: auto;
            display: block;
            padding: 0;
            width: 640px;

        }

        #player {
            height: 480px;
            width: 640px;
            margin-left: auto;
            margin-right: auto;
            margin-top: 8px;
            display: block;
        }

        #swfUrl {
            display: none;
        }
    </style>
</head>

<body>
    <nav style="position: relative; z-index: 2; width:100%">
        <ul>
            <li>
                <a href="https://flasharchive.azurewebsites.net/">Flash存档查询</a>
            </li>
            <li>
                <a href="http://www.compumuseum.com">电脑博物馆</a>
            </li>
            <li>
                <a href="https://zhuanlan.zhihu.com/retrocomputing">知乎专栏</a>
            </li>
        </ul>
    </nav>
    <div id="player_container">
        <p><a href="javascript:history.back()">返回目录/Back</a></p>
        <p>
            <b>{{chinese_name}}&nbsp;|&nbsp;{{english_name}}</b>
        </p>
    </div>
    <div id="swfUrl">{{playaddress}}</div>
    <script>

        function getUrlVars() {
            var vars = {};
            var parts = window.location.href.replace(/[?&]+([^=&]+)=([^&]*)/gi, function (m, key, value) {
                vars[key] = value;
            });
            return vars;
        }

        window.RufflePlayer = window.RufflePlayer || {};

    window.RufflePlayer = window.RufflePlayer || {};
    window.addEventListener("load", (event) => {
        let swfUrl = document.getElementById('swfUrl').innerText;
        const ruffle = window.RufflePlayer.newest();
        const player = ruffle.createPlayer();
        const container = document.getElementById("player_container");
        container.appendChild(player);
        player.load(swfUrl);
    });

    </script>
    <script src="https://cdn.jsdelivr.net/npm/@ruffle-rs/ruffle@0.2.0-nightly.2025.10.21/ruffle.min.js"></script>

</body>

</html>
